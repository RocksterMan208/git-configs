general {
	hide_cursor = true
}

background {
	monitor =
	path = ~/.wallpapers/image2.png
}

# Time
label {
	monitor =
	text = $TIME
	color = rgba(255, 255, 255, 1)
	font_size = 86
	halign = left
	valign = top
	position = 60, -100
}

# Current date
label {
	monitor =
	text = cmd[update:100000] echo "$(date +'%A %e %B')"
	font_size = 24
	valign = top
	halign = left
	position = 80, -250
}

# Self-explanatory
input-field {
	monitor =
	size = 250, 37
	rounding = 5
	halign = left
	valign = bottom
	position = 75, 50

	inner_color = rgba(50, 50, 50, 1.0)
	outer_color = rgba(75, 75, 75, 1.0)

	font_color = rgba(200, 200, 200, 1.0)
}
